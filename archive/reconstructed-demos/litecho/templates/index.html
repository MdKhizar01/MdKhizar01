<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Litecho</title>
<style>body{font:18px system-ui;max-width:800px;margin:40px auto;padding:20px}textarea{width:100%;min-height:220px}button{padding:12px;margin:10px 0}label{display:block;margin:16px 0}audio{width:100%}</style>
<h1>Litecho</h1><p>Convert text to audio. Reconstructed local demo.</p><label>Optional TXT, PDF, or image <input id="file" type="file" accept=".txt,.pdf,.png,.jpg,.jpeg"></label><button id="extract">Extract text</button>
<label for="text">Text to read</label><textarea id="text" maxlength="10000"></textarea><p>Creating audio sends this text to Google's speech service through gTTS.</p><button id="convert">Create audio</button><p id="status" role="status"></p><audio id="player" controls></audio><p><a id="download" hidden download="litecho.mp3">Download MP3</a></p>
<script>
let url;const status=document.getElementById('status');
document.getElementById('extract').onclick=async()=>{try{const f=document.getElementById('file').files[0];if(!f)throw Error('Choose a file');const data=new FormData();data.append('file',f);const r=await fetch('/api/extract',{method:'POST',body:data});const j=await r.json();if(!r.ok)throw Error(j.error);document.getElementById('text').value=j.text;status.textContent=j.truncated?'Text limited to 10000 characters.':'Text extracted.'}catch(e){status.textContent=e.message}};
document.getElementById('convert').onclick=async()=>{status.textContent='Creating audio…';try{const r=await fetch('/api/audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('text').value})});if(!r.ok)throw Error((await r.json()).error);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(await r.blob());document.getElementById('player').src=url;const d=document.getElementById('download');d.href=url;d.hidden=false;status.textContent='Audio ready.'}catch(e){status.textContent=e.message}};
</script></html>

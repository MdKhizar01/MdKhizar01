 function draw(v){
 buttons.classed('active',(d,i)=>i+1===v).attr('aria-pressed',(d,i)=>i+1===v);d3.select('#title').text(titles[v-1]);d3.select('#caption').text(captions[v-1]);
 const svg=d3.select('#chart');svg.selectAll('*').remove();const margin={top:30,right:270,bottom:70,left:85},iw=1080-margin.left-margin.right,ih=640-margin.top-margin.bottom;
 const g=svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);
 const x=d3.scaleLinear().domain(d3.extent(data,d=>d[X_COL])).nice().range([30,iw-30]);
 const y=d3.scaleLinear().domain(d3.extent(data,d=>d[Y_COL])).nice().range([ih-30,30]);
 const familyY=d3.scalePoint().domain(cats).range([55,ih-55]);
 const color=d3.scaleOrdinal().domain(cats).range(d3.schemeTableau10);
 const size=d3.scaleSqrt().domain([0,d3.max(data,d=>d[SIZE_COL])]).range([0,26]);
 const badColor=d3.scaleSequential().domain([0,cats.length-1]).interpolator(d3.interpolateBlues);
 const symbols=[d3.symbolCircle,d3.symbolSquare,d3.symbolTriangle,d3.symbolDiamond,d3.symbolStar];
 const badShape=d3.scaleQuantize().domain(d3.extent(data,d=>d[Y_COL])).range(symbols);
 g.append('g').attr('class','grid').call(d3.axisLeft(v===4?familyY:y).tickSize(-iw).tickFormat(''));

 else {marks=g.selectAll('circle.mark').data(sorted).join('circle').attr('class','mark').attr('cx',d=>x(d[X_COL])).attr('cy',d=>y(d[Y_COL])).attr('r',d=>v>=3?size(d[SIZE_COL]):5).attr('fill',d=>v===5&&d.configuration==='Neural-08'?'#c2188b':v>=2?color(d[CAT_COL]):'#4878a8').attr('opacity',v>=3?.78:1);}
